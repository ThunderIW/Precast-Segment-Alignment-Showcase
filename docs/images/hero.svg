    <text x="1110" y="254" text-anchor="end" font-family="'IBM Plex Sans Condensed','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#087a0c">with shims <tspan font-weight="700">2.2 mm</tspan></text>
