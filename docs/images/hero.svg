<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Precast Segment Alignment</title>
  <desc id="desc">Wiecon's Precast Segment Alignment app tracks precast bridge segments as they are erected and plans the shims that keep the deck on its design alignment. An elevation of the segment chain with shims in two joints sits above a deviation chart: left uncorrected, the Demo run ends 137 mm off at mid-span; with the planned shims it ends 2.2 mm off, inside the plus or minus 5 mm envelope.</desc>

  <rect x="0" y="0" width="1200" height="420" rx="22" fill="#eff1ed"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#c3c2b7" stroke-width="2"/>

  <g id="title-block">
    <image x="56" y="40" width="150" height="96" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
    <text x="56" y="172" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="17" letter-spacing="2" fill="#1c5cab" font-weight="600">CAMBER CONTROL · PRECAST SEGMENTAL DECKS</text>
    <text x="54" y="232" font-family="'IBM Plex Sans Condensed','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" fill="#16235c" letter-spacing="-0.5">Precast Segment</text>
    <text x="54" y="290" font-family="'IBM Plex Sans Condensed','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" fill="#16235c" letter-spacing="-0.5">Alignment</text>
    <text x="56" y="332" font-family="'IBM Plex Sans Condensed','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#4c5358">Track each segment as it is erected, and plan</text>
    <text x="56" y="360" font-family="'IBM Plex Sans Condensed','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#4c5358">the shims that keep the deck on its design line.</text>
  </g>

